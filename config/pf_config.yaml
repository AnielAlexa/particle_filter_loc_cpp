camera_original:
  fx: 1139.0
  fy: 1139.0
  w: 1280
  h: 720
  heading_offset_deg: 270   # camera mount offset added to yaw for satellite alignment
  recon_extra_heading_deg: -90   # extra rotation applied only to satellite reconstruction (does not affect QR)

enu_origin:
  lat: 45.7896
  lon: 21.1928

particle_filter:
  n_tracking: 250
  sigma_pos_dispersed: 2.0
  sigma_pos_tracking: 0.3       # VIO: minimal pos noise; bias state carries drift
  sigma_hdg_dispersed: 10.0
  sigma_hdg_tracking: 2.0

  drift_noise_m_per_s: 0.0      # simulate VIO drift
  sigma_obs_coarse: 10.0        # tight coarse pull
  sigma_obs_fine: 8.0           # base observation sigma — softened to smooth corrections and reduce jumps
  top_k_coarse: 5
  ess_threshold_fraction: 0.5
  init_altitude_m: 5.0          # seed PF early; camera processing still gated by matcher.altitude_min_process_m
  tracking_spread_m: 20.0       # enter TRACKING earlier
  lost_spread_m: 200.0          # only catastrophic divergence triggers LOST
  fine_every_n_frames: 2        # more frequent corrections
  fine_early_exit_inliers: 15   # jetson: cascade — stop fine matching once inliers >= this
  fine_min_inliers_heading: 12
  # Adaptive search (driven by particle spread)
  min_search_radius_m: 40.0
  search_radius_multiplier: 2.5
  base_context_fraction: 0.2
  max_context_fraction: 1.0
  sat_ctx_spread_low_m: 0.0     # spread for satellite_context_scale_min
  sat_ctx_spread_high_m: 20.0   # spread at which satellite_context_scale_max is reached
  # Static detection: suppress noise when hovering
  static_threshold_m: 0.15      # RTK delta below this = static
  static_sigma_scale: 0.1       # process noise multiplier when static
  # Fine match gates
  pnp_altitude_gate_m: 15.0     # reject PnP if |pnp_alt - baro_alt| exceeds this
  min_inlier_ratio: 0.35        # reject fine match if inlier_ratio below this
  flow_mag_cv_ref: 0.30         # sigma penalty ref CV: sigma *= clamp(ref/cv, 1, max). 0 = disabled
  flow_mag_cv_max_penalty: 4.0  # cap on sigma inflation from low flow-CV (aliased scenes)
  corr_dist_sigma_gate_m: 10.0  # sanity brake: inflate sigma when vote centroid >this from PF mean. 0 = off
  corr_dist_sigma_max: 8.0      # cap on sigma inflation from large correction
  # Roughening: jitter after resampling to prevent particle collapse
  roughen_enabled: true
  roughen_scale: 0.5            # minimal roughening
  # Student-t likelihood: mild outlier robustness (nu>100 = Gaussian)
  likelihood_nu: 3.0

  # ── Bias model (5-state PF) ──
  sigma_bias_random_walk: 0.30  # m/step bias drift — bias absorbs VIO drift instead of position noise
  sigma_bias_init: 0.01         # initial bias uncertainty (near zero)
  bias_clamp_m: 25.0            # max bias magnitude (VIO: needs headroom to absorb drift)
  vio_jump_threshold_m: 4.0     # per-step VIO displacement to trigger jump absorption
  vio_jump_velocity_ema_alpha: 0.3
  obs_min_inliers_apply: 30     # base threshold at ref altitude (scales up with altitude)
  obs_min_inliers_ref_alt: 50.0 # reference altitude for adaptive scaling
  obs_min_inliers_max: 80       # upper clamp (don't over-filter)
  inlier_tau: 120.0             # PF trust curve: tuned for LiteSAM (up to ~300 inliers)
  init_yaw: 0.0                 # ENU heading at init (deg; 0 = use RTK yaw)
  vio_yaw_offset_deg: 0.0       # PF position now in true ENU
  init_sigma_pos: 0.2           # tight RTK init (m)
  init_sigma_hdg: 2.0           # degrees

  # Jump detection: per-frame estimate shift above these → bump reset_counter
  # so AP's EKF re-anchors instead of rejecting as outlier.
  jump_reset_distance_m: 25.0
  jump_reset_yaw_deg: 15.0
  # Sliding-window match voting: PF no longer gates matches against its own
  # estimate. Matches go into a recent-window; only the inlier-weighted
  # centroid of the agreeing cluster (≥vote_min_agree of last vote_window_size
  # matches within vote_agreement_m) is applied. Single outliers update nothing.
  vote_enabled: true
  vote_window_size: 6
  vote_min_agree: 4
  vote_agreement_m: 13.0
  vote_max_age_frames: 15

  # LOST recovery
  lost_fine_stale_frames: 999999  # disabled — tight filter shouldn't go LOST just for stale matches
  lost_recovery_min_inliers: 15
  lost_recovery_verify_agreement_m: 20.0
  lost_recovery_sigma_pos: 2.0
  lost_recovery_sigma_hdg: 5.0

trust:
  # Signal weights (must sum to 1.0)
  inlier_tau: 25.0
  inlier_weight: 0.43
  sim_floor: 0.10
  sim_ceiling: 0.55
  sim_weight: 0.15
  consistency_weight: 0.11
  consistency_min_radius_m: 30.0
  altitude_weight: 0.11
  altitude_ref_m: 60.0
  geometry_weight: 0.20
  # Sigma modulation
  sigma_min_scale: 0.3
  sigma_max_scale: 5.0
  # Drift detection (PF self-confidence based)
  drift_pf_confidence_threshold: 0.3
  drift_coarse_sim_min: 0.35
  drift_sigma_cap: 3.0
  # EMA smoothing
  ema_alpha: 0.5
  min_confidence: 0.05
  # Coarse teleport (continuous)
  coarse_sim_floor: 0.25
  coarse_sim_ceiling: 0.60
  coarse_max_teleport_fraction: 0.8
  coarse_teleport_sigma_range: [15.0, 30.0]

matchers:
  script_dir: "/home/jetson/ros2_ws/src/particle_filter_loc_cpp/model"
  # coarse is loaded for LOST recovery only; Stage C fallback is hard-disabled in pf_node.cpp
  coarse_enabled: false
  # VLAD+PCA TRT
  use_vlad_trt: true
  vlad_trt_engine_path: "dinov3_vlad_pca768_l10_value_256.engine"
  vlad_database_path:    "data/descriptors_vlad_l10_aerial/vlad_descriptors_pca768.pt"
  vlad_patch_names_path: "data/descriptors_vlad_l10_aerial/patch_names.txt"
  # BoQ TRT (fallback)
  boq_engine_path: "dinov3_lora_gray_boq_l10_value_256.engine"
  boq_database_path: "data/descriptors_boq/boq_descriptors.pt"
  patch_names_path: "data/descriptors_boq/patch_names.txt"
  ransac_max_iters: 1000          # jetson: cap findHomography iterations (cv2 default=2000)
  fine_engine_path: "LiteSAM/litesam_full_288x512.engine"
  gps_metadata_path: "data/patches/gps_metadata.json"
  patches_dir: "data/patches"
  image_size: 256
  grayscale: true
  matcher_width: 512
  matcher_height: 288
  # Intrinsics rescaled from sky-sqrtVINS kalibr_imucam_chain.yaml (1280x720,
  # fx=1129.0183, fy=1129.8245, cx=620.0480, cy=499.3094) by factor 0.4 for
  # the direct resize path (no crop).
  camera_fx: 451.6073
  camera_fy: 451.9298
  camera_cx: 248.0192
  camera_cy: 199.7238
  context_enabled: true
  context_fraction: 0.2
  fine_conf_threshold: 0.17
  min_inliers_ransac: 4
  min_inliers: 8
  min_inliers_homography: 8
  mosaic_context_scale: 1.2        # mosaic crop = footprint_diagonal * this
  satellite_context_scale_min: 1.0 # tight context (refinement pass + low spread)
  satellite_context_scale_max: 1.2 # wide context (reached at pf.sat_ctx_spread_high_m)

init:
  # QR-based init (sky-lign): drone sits ~20cm above an iPhone displaying the
  # `geo:LAT,LON` QR; canvas is rotated so QR top points to true North.
  qr_min_side_px: 40
  qr_max_aspect_skew: 0.30
  qr_stable_n: 5                 # consecutive QR detections required before seeding
  qr_yaw_max_stddev_deg: 1.5
  qr_pos_max_stddev_m: 0.05
  qr_phi_offset_deg: -90.0       # additive bias on phi_img inside QR detector;
                                 # use to correct QR yaw without disturbing
                                 # camera.heading_offset_deg (satellite warp).

debug:
  viz_drone_vs_sat: true         # show drone | satellite_recon side-by-side via cv::imshow

replay:
  camera_topic: "/camera/image_pf"
  rtk_topic: "/m300/rtk/fix"
  yaw_topic: "/m300/rtk/yaw"
  altimeter_topic: "/altimeter/range"
  vio_pose_topic: "/ov_srvins/poseimu"
